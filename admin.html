
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidyasetu Admin Dashboard</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f2;
  color:#243329;
}
header{
  background:#14532d;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.container{
  max-width:900px;
  margin:30px auto;
  padding:15px;
}
.card{
  background:white;
  padding:22px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 10px #0001;
}
input,textarea,select{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
}
button{
  background:#15803d;
  color:white;
  padding:12px 18px;
  border:0;
  border-radius:6px;
  margin:5px;
  cursor:pointer;
}
.delete{background:#dc2626}
.edit{background:#2563eb}
.hidden{display:none}
.item{
  border:1px solid #ddd;
  padding:15px;
  border-radius:8px;
  margin:12px 0;
  overflow-wrap:anywhere;
}
</style>
</head>

<body>

<header>
  <h2>🌱 Vidyasetu Admin</h2>
  <button id="logout">Logout</button>
</header>

<div class="container">

  <div class="card" id="loginBox">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">
    <button id="login">Login</button>
    <p id="loginMessage"></p>
  </div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <h2>Welcome to Admin Dashboard</h2>
      <p>Manage Vidyasetu educational resources.</p>
    </div>

    <div class="card">
      <h2>Add / Edit Study Material</h2>

      <input id="title" placeholder="Material Title">

      <select id="course">
        <option value="">Select Course</option>
        <option>Diploma Agriculture</option>
        <option>B.Sc. Agriculture</option>
        <option>M.Sc. Agriculture</option>
      </select>

      <select id="subject">
        <option value="">Select Subject</option>
        <option>Agronomy</option>
        <option>Agricultural Entomology</option>
        <option>Plant Pathology</option>
        <option>Soil Science</option>
        <option>Horticulture</option>
        <option>Plant Breeding</option>
        <option>Agricultural Economics</option>
        <option>Agricultural Extension</option>
      </select>

      <textarea id="description"
        placeholder="Description"></textarea>

      <input id="pdfUrl"
        type="url"
        placeholder="PDF / Study Material URL">

      <button id="save">Add Material</button>
      <button id="cancelEdit" class="hidden">Cancel Edit</button>

      <p id="status"></p>
    </div>

    <div class="card">
      <h2>Manage Study Materials</h2>
      <div id="materials">Loading...</div>
    </div>

    <div class="card">
      <h2>Manage Notices</h2>
      <input id="noticeTitle" placeholder="Notice Title">
      <textarea id="noticeText"
        placeholder="Notice Details"></textarea>
      <button id="addNotice">Publish Notice</button>
      <div id="notices"></div>
    </div>

  </div>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDoc,
 doc,
 updateDoc,
 deleteDoc,
 onSnapshot,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyDE6FRAN5F9KCU0QfPyzUeEMn3LuxIXhj0",
 authDomain:"vidyasetu-b4de2.firebaseapp.com",
 projectId:"vidyasetu-b4de2",
 storageBucket:"vidyasetu-b4de2.firebasestorage.app",
 messagingSenderId:"451136037814",
 appId:"1:451136037814:web:9c0a83fff8558cf7075717"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

let editingId=null;
let unsubscribe=null;

$("login").onclick=async()=>{
 try{
  $("loginMessage").textContent="Please wait...";
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
 }catch(e){
  $("loginMessage").textContent=e.message;
 }
};

onAuthStateChanged(auth,async user=>{
 if(unsubscribe){
  unsubscribe();
  unsubscribe=null;
 }

 $("dashboard").classList.add("hidden");
 $("loginBox").classList.remove("hidden");

 if(!user)return;

 try{
  const adminDoc=await getDoc(
   doc(db,"admins",user.uid)
  );

  if(!adminDoc.exists() ||
     adminDoc.data().role!=="admin"){
   $("loginMessage").textContent=
    "Access denied. Admin account required.";
   await signOut(auth);
   return;
  }

  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");

  loadMaterials();
  loadNotices();

 }catch(e){
  $("loginMessage").textContent=e.message;
  await signOut(auth);
 }
});

$("logout").onclick=()=>signOut(auth);

function loadMaterials(){
 unsubscribe=onSnapshot(
  collection(db,"materials"),
  snapshot=>{
   $("materials").innerHTML="";

   snapshot.forEach(d=>{
    const m=d.data();

    const div=document.createElement("div");
    div.className="item";

    const heading=document.createElement("h3");
    heading.textContent=m.title||"Untitled";

    const details=document.createElement("p");
    details.textContent=
     (m.course||"")+" | "+(m.subject||"");

    const description=document.createElement("p");
    description.textContent=m.description||"";

    const edit=document.createElement("button");
    edit.className="edit";
    edit.textContent="Edit";
    edit.onclick=()=>editMaterial(d.id,m);

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="Delete";
    del.onclick=()=>removeMaterial(d.id);

    div.append(heading,details,description,edit,del);

    if(m.pdfUrl){
     const link=document.createElement("a");
     link.href=m.pdfUrl;
     link.target="_blank";
     link.rel="noopener noreferrer";
     link.textContent="Open Study Material";
     div.append(link);
    }

    $("materials").append(div);
   });
  },
  error=>{$("status").textContent=error.message;}
 );
}

async function saveMaterial(){
 const title=$("title").value.trim();
 const course=$("course").value;
 const subject=$("subject").value;
 const description=$("description").value.trim();
 const pdfUrl=$("pdfUrl").value.trim();

 if(!title||!course||!subject){
  $("status").textContent="Fill all required fields.";
  return;
 }

 if(pdfUrl){
  try{
   const url=new URL(pdfUrl);
   if(url.protocol!=="https:"){
    throw new Error();
   }
  }catch{
   $("status").textContent="Enter a valid HTTPS URL.";
   return;
  }
 }

 $("save").disabled=true;

 try{
  const data={
   title,course,subject,description,pdfUrl,
   updatedAt:serverTimestamp()
  };

  if(editingId){
   await updateDoc(
    doc(db,"materials",editingId),data
   );
  }else{
   await addDoc(collection(db,"materials"),{
    ...data,
    createdAt:serverTimestamp()
   });
  }

  resetForm();
  $("status").textContent="Saved successfully!";

 }catch(e){
  $("status").textContent=e.message;
 }finally{
  $("save").disabled=false;
 }
}

function editMaterial(id,m){
 editingId=id;
 $("title").value=m.title||"";
 $("course").value=m.course||"";
 $("subject").value=m.subject||"";
 $("description").value=m.description||"";
 $("pdfUrl").value=m.pdfUrl||"";
 $("save").textContent="Update Material";
 $("cancelEdit").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}

async function removeMaterial(id){
 if(!confirm("Delete this material?"))return;

 try{
  await deleteDoc(doc(db,"materials",id));
 }catch(e){
  alert(e.message);
 }
}

function resetForm(){
 editingId=null;
 ["title","course","subject","description","pdfUrl"]
 .forEach(id=>$(id).value="");

 $("save").textContent="Add Material";
 $("cancelEdit").classList.add("hidden");
}

$("save").onclick=saveMaterial;
$("cancelEdit").onclick=resetForm;

async function loadNotices(){
 onSnapshot(collection(db,"notices"),snapshot=>{
  $("notices").innerHTML="";

  snapshot.forEach(d=>{
   const div=document.createElement("div");
   div.className="item";

   const h=document.createElement("h3");
   h.textContent=d.data().title||"";

   const p=document.createElement("p");
   p.textContent=d.data().text||"";

   const del=document.createElement("button");
   del.className="delete";
   del.textContent="Delete";
   del.onclick=async()=>{
    if(confirm("Delete this notice?")){
     await deleteDoc(doc(db,"notices",d.id));
    }
   };

   div.append(h,p,del);
   $("notices").append(div);
  });
 });
}

$("addNotice").onclick=async()=>{
 const title=$("noticeTitle").value.trim();
 const text=$("noticeText").value.trim();

 if(!title||!text){
  alert("Enter notice details.");
  return;
 }

 try{
  await addDoc(collection(db,"notices"),{
   title,text,
   createdAt:serverTimestamp()
  });

  $("noticeTitle").value="";
  $("noticeText").value="";
  alert("Notice published!");
 }catch(e){
  alert(e.message);
 }
};

</script>
</body>
</html>
